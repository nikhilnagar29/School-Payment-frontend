services:
  - type: web
    name: school-payment-dashboard
    env: node
    buildCommand: npm install && npm run build:render
    staticPublishPath: ./build
    startCommand: npx serve -s build --single
    envVars:
      - key: NODE_VERSION
        value: 18.x
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
