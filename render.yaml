services:
  - type: web
    name: school-payment-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build:render
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: NODE_VERSION
        value: 18.15.0
    headers:
      - path: "/*"
        name: Cache-Control
        value: no-cache
      - path: "/*"
        name: X-Frame-Options
        value: DENY
